name: haproxy-spoe-vibes
base: core22
version: '1.0'
summary: Local LLM REST API using llama-server and Qwen 0.5B
description: |
  A fully automated deployment of a lightweight, CPU-only Large Language Model.
  This snap packages llama.cpp's server with Qwen2.5-0.5B to expose an 
  OpenAI-compatible REST API.
confinement: strict

apps:
  llama-server:
    command: bin/start-llama-server
    daemon: simple
    plugs: 
      - network
      - network-bind
  spoe-agent:
    command: bin/start-haproxy-spoe-vibes
    daemon: simple
    plugs: 
      - network
      - network-bind

parts:
  llama.cpp:
    source: https://github.com/ggml-org/llama.cpp
    source-type: git
    plugin: cmake
    stage-packages:
      - libgomp1
  llama-model:
    plugin: nil
    source: models
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/models
      cp qwen.gguf $CRAFT_PART_INSTALL/models/model.gguf
  spoe-agent:
    plugin: go
    source: .
    build-snaps:
      - go/1.22/stable
  scripts:
    plugin: dump
    source: ./scripts
    override-prime: |
      craftctl default
      chmod -R +rx $CRAFT_PRIME/bin
