name: haproxy-spoe-vibes
base: core22
version: '1.0'
summary: HAProxy SPOE agent that screens HTTP requests with an LLM
description: |
  An HAProxy SPOE agent that inspects incoming HTTP requests, asks an
  OpenAI-compatible LLM API whether each request is safe, picks a backend,
  and returns a denial reason. Authentication is done with an API key.
confinement: strict

apps:
  spoe-agent:
    command: bin/start-haproxy-spoe-vibes
    daemon: simple
    plugs:
      - network
      - network-bind

parts:
  spoe-agent:
    plugin: go
    source: .
    build-snaps:
      - go/1.25/stable
  scripts:
    plugin: dump
    source: ./scripts
    override-prime: |
      craftctl default
      chmod -R +rx $CRAFT_PRIME/bin
